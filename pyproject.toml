[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexrag"
version = "0.1.0"
description = "Contract & case-law intelligence platform: hybrid RAG with citation-grounded, refusal-aware generation."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Terry Nyirenda" },
]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",  # required by FastAPI for file uploads (POST /upload)
    # --- Data / settings ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    # --- Document processing ---
    "pypdf>=4.3.0",
    "tiktoken>=0.8.0",
    # --- Embeddings / reranking ---
    "sentence-transformers>=3.1.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    # --- Storage clients ---
    "pymongo>=4.9.0",
    "qdrant-client>=1.11.0",
    # Pinned <9: elasticsearch-py 9.x sends a "compatible-with=9" Accept header
    # that the docker-compose 8.15.0 server rejects outright (only 7/8 accepted).
    "elasticsearch>=8.15.0,<9",
    # --- Generation (provider-agnostic interface, OpenAI-compatible default) ---
    "openai>=1.50.0",
    "httpx>=0.27.0",
    # --- Evaluation ---
    "ragas>=0.2.0",
    "deepeval>=1.4.0",
    # ragas 0.4.x unconditionally imports langchain_community.chat_models.vertexai
    # at module load (ragas/llms/base.py) even though we never use a Vertex AI
    # LLM -- that submodule was removed in langchain-community>=0.4, breaking
    # `import ragas` outright. Pinned to the last 0.3.x release (compatible with
    # our langchain-core>=1.x via other deps) until upstream ragas fixes the
    # import guard. See docs/experiments/evaluation_notes.md.
    "langchain-community>=0.3.27,<0.4",
    "optimum[onnxruntime]>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises a real MongoDB/Qdrant/Elasticsearch dependency (see tests/integration/README.md); skips itself if unreachable rather than failing a plain `pytest` run.",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's `Depends(...)`/`Query(...)`/... in argument defaults is the idiomatic pattern, not a mutable-default bug.
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
# tests/ has no __init__.py files (pytest doesn't need them); without this,
# mypy can't disambiguate same-named test modules across subdirectories.
explicit_package_bases = true

[tool.hatch.build.targets.wheel]
packages = ["api", "configs", "domain", "evaluation", "generation", "ingestion", "retrieval"]
