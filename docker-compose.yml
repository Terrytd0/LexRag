# Local development stack: FastAPI + MongoDB + Qdrant + Elasticsearch.
# Not a production/Kubernetes deployment -- see docs/architecture.md.
#
# Usage:
#   cp .env.example .env   # fill in OPENAI_API_KEY etc.
#   docker compose up

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override host-local defaults from .env.example with in-network service names.
      MONGODB_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Pinned explicitly (rather than relying on the implicit ~/.cache/huggingface
      # default) so the huggingface_cache volume below always mounts the exact path
      # sentence-transformers/huggingface_hub actually read from -- without this,
      # every `docker compose build`/container recreation re-downloads bge-m3 (~2.3GB)
      # and bge-reranker-v2-m3 (~1-2GB) from HuggingFace Hub from an empty container
      # filesystem, which is what made the Day 4 production-hardening pass's container
      # rebuild take several minutes. No code change needed elsewhere:
      # EmbeddingService/CrossEncoderReranker just call SentenceTransformer(model_name)/
      # CrossEncoder(model_name), and both read HF_HOME themselves.
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget; a bare TCP probe via bash is the
      # commonly used stand-in (see Qdrant's own Docker Compose examples).
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mongo_data:
  qdrant_data:
  es_data:
  # Persists downloaded model weights (bge-m3, bge-reranker-v2-m3) across
  # `docker compose build`/container recreation -- first startup downloads
  # from HuggingFace Hub as before; every subsequent rebuild/restart reuses
  # this volume instead of re-downloading. No manual copying needed.
  huggingface_cache:
